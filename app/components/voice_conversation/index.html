<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Voice check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Isolated iframe document — cannot read the parent app's CSS custom
     properties, so app/theme.py's palette is hardcoded here as a literal
     copy. Keep in sync with app/theme.py::PALETTE if the brand color changes.
     COLOR_USER/COLOR_AGENT/COLOR_IDLE in main.js are lightness variants of
     the same brand hue (#34496B) — not new palette entries. */
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    color: #1D212E;
    display: flex;
    justify-content: center;
  }

  .voice-hero {
    width: 100%;
    max-width: 480px;
    min-height: 540px;
    padding: 28px 20px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }

  /* ── Status caption ─────────────────────────────────────────────────── */
  #status {
    font-size: 17px;
    font-weight: 600;
    text-align: center;
    min-height: 24px;
    color: #1D212E;
    margin-bottom: 2px;
  }

  /* ── Waveform ────────────────────────────────────────────────────────── */
  .waveform-wrap {
    width: 100%;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 140px;
    overflow: visible;
  }
  #waveform {
    width: 100%;
    max-width: 420px;
    height: 120px;
    display: block;
  }

  /* ── Progress + meta (secondary, quiet) ─────────────────────────────── */
  #progressOuter {
    background: #E1E5EC;
    border-radius: 999px;
    height: 4px;
    width: 70%;
    max-width: 260px;
    overflow: hidden;
  }
  #progressBar {
    background: #34496B;
    height: 100%;
    width: 100%;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease; /* transform, not width — avoids layout thrash */
  }
  .meta {
    font-size: 11.5px;
    font-family: 'IBM Plex Mono', 'IBM Plex Sans', monospace;
    color: #5E6473;
    text-align: center;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ── Controls ────────────────────────────────────────────────────────── */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .mic-btn {
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #34496B 0%, #283A58 100%);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 32px -8px rgba(29, 33, 46, 0.35), 0 6px 20px -6px rgba(29, 33, 46, 0.25);
    transition: box-shadow 0.2s ease, transform 0.15s ease;
    flex-shrink: 0;
  }
  .mic-btn:hover:not(:disabled) {
    box-shadow: 0 14px 36px -6px rgba(29, 33, 46, 0.4), 0 6px 20px -6px rgba(29, 33, 46, 0.3);
    transform: translateY(-1px);
  }
  .mic-btn:focus-visible {
    outline: 2px solid #34496B;
    outline-offset: 3px;
  }
  .mic-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .mic-btn svg {
    width: 28px;
    height: 28px;
    position: relative;
    z-index: 1;
  }

  /* Pulsing ring — only while a session is actively listening (not while
     the agent is speaking, since the user isn't the one being recorded
     then). Respects prefers-reduced-motion: reduce below. */
  .mic-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid #34496B;
    opacity: 0;
  }
  body.is-started:not(.is-speaking) .mic-ring {
    animation: micPulse 1.8s ease-out infinite;
  }
  body.is-speaking .mic-btn {
    background: linear-gradient(135deg, #7B93AF 0%, #5E749A 100%);
  }
  @keyframes micPulse {
    0%   { transform: scale(1);   opacity: 0.55; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    body.is-started:not(.is-speaking) .mic-ring {
      animation: none;
      opacity: 0.35;
    }
  }

  .wrap-link {
    padding: 4px 10px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: #5E6473;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, color 0.2s ease;
  }
  .wrap-link:hover:not(:disabled) { color: #34496B; }
  body.is-started .wrap-link:not(:disabled) {
    opacity: 1;
    pointer-events: auto;
  }
</style>
</head>
<body>
  <div class="voice-hero">
    <div id="status">Tap the mic to start your check-in.</div>

    <div class="waveform-wrap">
      <canvas id="waveform" aria-hidden="true"></canvas>
    </div>

    <div id="progressOuter"><div id="progressBar"></div></div>
    <div class="meta">
      <span id="speechSeconds">0s</span> spoken &nbsp;&middot;&nbsp; <span id="elapsedSeconds">0s</span> elapsed
      <span id="gateState" class="sr-only">Idle</span>
    </div>

    <div class="controls">
      <button id="startBtn" class="mic-btn" aria-label="Start voice check-in">
        <span class="mic-ring" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </button>
      <button id="wrapUpBtn" class="wrap-link" disabled>Wrap up</button>
    </div>
  </div>
  <script src="./main.js"></script>
</body>
</html>
