[project]
name = "emoeating"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["emoeating*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: loads the real emotion2vec+ model; skipped in CI"]
